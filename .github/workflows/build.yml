name: Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
        # Quitamos el path: "src" para que los archivos queden en la raíz

      - name: Setup JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build Plugins
        run: |
          # Ya no necesitamos "cd src" porque todo está en la raíz
          chmod +x gradlew
          ./gradlew make makePluginsJson
          
          # Preparamos la carpeta de salida
          mkdir -p dist
          cp build/plugins.json dist/
          # Copiamos todos los archivos .cs3 generados
          find . -name "*.cs3" -exec cp {} dist/ \;

      - name: Deploy to Builds Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: builds
          token: ${{ secrets.GITHUB_TOKEN }}
          single-commit: true
